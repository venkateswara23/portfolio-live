# ==============================================================================
# Prometheus Configuration for Website Uptime & Blackbox Synthetic Probing
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Direct application metrics scraping
  - job_name: "portfolio-app-metrics"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          environment: "production"
          service: "portfolio-backend"

  # 2. Blackbox Exporter synthetic HTTP uptime probe
  - job_name: "website-uptime-probe"
    metrics_path: "/probe"
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://host.docker.internal:8080/health"
          - "http://host.docker.internal:8080/index.html"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
