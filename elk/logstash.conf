# ==============================================================================
# Logstash Pipeline Configuration for Portfolio Application & Server Logs
# Part of the ELK Stack Integration (Elasticsearch, Logstash, Kibana)
# ==============================================================================

input {
  # 1. Beats input (e.g., from Filebeat shipping server logs)
  beats {
    port => 5044
  }

  # 2. Direct TCP stream input (e.g., Logback or Python TCP appender)
  tcp {
    port => 5000
    codec => json_lines
  }

  # 3. Direct local file tailing
  file {
    path => "/usr/share/logstash/pipeline/logs/portfolio-elk.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "portfolio-server"
  }
}

filter {
  # If log was parsed as json, ensure standard ELK fields exist
  if [type] == "portfolio-server" or [service] == "portfolio-backend" {
    mutate {
      add_field => { "environment" => "production" }
      add_field => { "application" => "portfolio-backend" }
    }

    # Normalize response status code to integer
    if [status] {
      mutate {
        convert => { "status" => "integer" }
        convert => { "duration_ms" => "float" }
      }
    }

    # Classify HTTP status codes for easy Kibana filtering
    if [status] >= 200 and [status] < 300 {
      mutate { add_field => { "http_status_category" => "2xx_Success" } }
    } else if [status] >= 300 and [status] < 400 {
      mutate { add_field => { "http_status_category" => "3xx_Redirection" } }
    } else if [status] >= 400 and [status] < 500 {
      mutate { add_field => { "http_status_category" => "4xx_Client_Error" } }
    } else if [status] >= 500 {
      mutate { add_field => { "http_status_category" => "5xx_Server_Error" } }
    }

    # Date filter: Parse application ISO timestamp
    if [@timestamp] {
      date {
        match => [ "@timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }

  # Fallback Grok filter for raw unformatted text logs
  if ![level] {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] \[%{LOGLEVEL:level}\] %{IP:client_ip} %{WORD:method} %{URIPATHPARAM:path} %{NUMBER:status:int} %{NUMBER:duration_ms:float}ms - %{GREEDYDATA:log_message}" }
    }
  }
}

output {
  # 1. Ship to Elasticsearch cluster
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
    # Optional authentication for secured clusters:
    # user => "elastic"
    # password => "changeme"
  }

  # 2. Output to stdout for real-time console monitoring
  stdout {
    codec => rubydebug
  }
}
