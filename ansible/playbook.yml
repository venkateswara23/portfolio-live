---
# ==============================================================================
# Ansible Playbook for Timmareddy Venkateswara Reddy Portfolio Server Deployment
# Automates: System updates, Docker installation, Code Deployment, and Health Check
# ==============================================================================

- name: Configure and Deploy Portfolio Server on AWS EC2
  hosts: portfolio_servers
  become: true
  vars:
    app_dir: "/home/ubuntu/portfolio-app"
    git_repo: "https://github.com/venkateswara23/portfolio-live.git"
    git_branch: "main"
    container_name: "portfolio-web"
    app_port: "8080"

  tasks:
    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
        state: present

    - name: Create Docker keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled on boot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Clone or pull latest portfolio repository from GitHub
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: yes
      become_user: ubuntu

    - name: Build Portfolio Docker image
      command: docker build -t portfolio-app:latest .
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Stop and remove existing portfolio container (if running)
      shell: |
        docker stop {{ container_name }} || true
        docker rm {{ container_name }} || true
      changed_when: false

    - name: Run Portfolio Docker Container
      command: >
        docker run -d
        --name {{ container_name }}
        --restart always
        -p {{ app_port }}:8080
        -e PORT=8080
        portfolio-app:latest
      changed_when: true

    - name: Wait for Portfolio Web Service to become healthy
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health_check
      retries: 6
      delay: 5
      until: health_check.status == 200

    - name: Deployment Success Notification
      debug:
        msg: "✅ Portfolio Server deployed successfully and verified healthy on port {{ app_port }}!"
